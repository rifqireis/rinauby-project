# ==============================================================================
# RENAISSANCE OS : KITTY TERMINAL THEME
# Everforest Dark Slate with Renaissance Gold accents & Kawase Blur support
# ==============================================================================

# Font Configuration
font_family      Iosevka Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window Layout & Padding
window_padding_width 16
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0

# Transparency & Background (Mendukung Kawase Blur Hyprland)
background_opacity 0.82
dynamic_background_opacity yes

# Color Scheme (Everforest Slate / Antique Parchment)
# background #232a2e
# foreground #d3c6aa
# cursor #db9c5e
# cursor_text_color #232a2e
# selection_background #3c4841
# selection_foreground #f4e8c1

# Black
# color0 #2d353b
# color8 #475258

# Red
# color1 #e67e80
# color9 #e67e80

# Green
# color2  #a7c080
# color10 #a7c080

# Yellow / Renaissance Gold
# color3  #db9c5e
# color11 #e5c07b

# Blue / Slate
# color4  #7fbbb3
# color12 #7fbbb3

# Magenta
# color5  #d699b6
# color13 #d699b6

# Cyan
# color6  #83c092
# color14 #83c092

# White / Parchment Cream
# color7  #d3c6aa
# color15 #f4e8c1


# BEGIN_KITTY_THEME
# Everforest Dark Hard
include current-theme.conf
# END_KITTY_THEME