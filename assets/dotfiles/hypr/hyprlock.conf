# ==============================================================================
# RINAUBY — HYPRLOCK (DIGITAL HUMANISM LOCKSCREEN)
# Adapted from host hyprlock with Classical Aesthetics & Gold Palette
# ==============================================================================

$active_wallpaper = /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/wallpapers/apotheosis.jpg
$gold_primary = rgba(219, 156, 94, 1.0)
$gold_bright = rgba(229, 192, 123, 1.0)
$bg_charcoal = rgba(26, 29, 33, 0.85)
$fg_cream = rgba(251, 242, 219, 1.0)
$fg_muted = rgba(211, 198, 170, 0.75)

general {
    immediate_render = true
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 1500
}

# ------------------------------------------------------------------------------
# BACKGROUND (Classical Wallpaper Blur)
# ------------------------------------------------------------------------------
background {
    monitor =
    path = $active_wallpaper
    blur_passes = 2
    blur_size = 6
    noise = 0.015
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.12
    vibrancy_darkness = 0.0
    color = rgba(20, 22, 26, 1.0)
}

# ------------------------------------------------------------------------------
# TOP: CLOCK & DATE (Classical Cinzel & Inter Typography)
# ------------------------------------------------------------------------------
label { # Clock (e.g. 10:12)
    monitor =
    text = <b>$TIME</b>
    color = $fg_cream
    font_size = 76
    font_family = Cinzel Bold, Inter Bold
    position = 0, 280
    halign = center
    valign = center
}

label { # Date (e.g. Monday, 15 December 2025)
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = $gold_bright
    font_size = 18
    font_family = Inter, SF Pro Display
    position = 0, 210
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# CENTER: RINAUBY MOTTO & USER AVATAR
# ------------------------------------------------------------------------------
label { # Renaissance Subtitle / Motto
    monitor =
    text = <span letter_spacing="2000">RINAUBY</span>
    color = $gold_primary
    font_size = 13
    font_family = Cinzel Bold
    position = 0, 140
    halign = center
    valign = center
}

image { # Avatar (KDE / User Avatar)
    monitor =
    path = /home/rifqi/.config/hypr/hyprlock/avatar-kde.png
    size = 90
    rounding = -1
    border_size = 2
    border_color = $gold_primary
    position = 0, 50
    halign = center
    valign = center
}

label { # Username
    monitor =
    text = Rifqi
    color = $fg_cream
    font_size = 18
    font_family = Inter Bold
    position = 0, -20
    halign = center
    valign = center
}

input-field { # Password Input (Frosted Charcoal Glass with Renaissance Gold Border)
    monitor =
    size = 280, 44
    outline_thickness = 2
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    outer_color = $gold_primary
    inner_color = $bg_charcoal
    font_color = $fg_cream
    font_family = Inter
    fade_on_empty = false
    placeholder_text = <span font_family="Inter" foreground="##d3c6aa77">Enter Passphrase...</span>
    hide_input = false
    check_color = $gold_bright
    fail_color = rgba(224, 108, 117, 0.90)
    fail_text = <span font_family="Inter" foreground="##e06c75"><i>Passphrase incorrect</i></span>
    capslock_color = rgba(229, 192, 123, 0.90)
    position = 0, -80
    halign = center
    valign = center
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] [ $(cat /sys/class/leds/*capslock*/brightness 2>/dev/null | head -n 1) -eq 1 ] && echo "⇪ Caps Lock is On" || echo ""
    color = $gold_bright
    font_size = 11
    font_family = Inter
    position = 0, -125
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# BOTTOM ACTIONS: SLEEP, SWITCH USER, POWER
# ------------------------------------------------------------------------------
# --- Action 1: Sleep ---
label {
    monitor =
    text = 󰤄
    color = $fg_cream
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = -120, -180
    halign = center
    valign = center
    onclick = systemctl suspend
}

label {
    monitor =
    text = <span letter_spacing="800">Sleep</span>
    color = $fg_muted
    font_size = 10
    font_family = Inter
    position = -120, -210
    halign = center
    valign = center
    onclick = systemctl suspend
}

# --- Action 2: Session ---
label {
    monitor =
    text = 󰌾
    color = $gold_primary
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = <span letter_spacing="800">Locked</span>
    color = $gold_bright
    font_size = 10
    font_family = Inter
    position = 0, -210
    halign = center
    valign = center
}

# --- Action 3: Switch User ---
label {
    monitor =
    text = 󰍂
    color = $fg_cream
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 120, -180
    halign = center
    valign = center
    onclick = loginctl lock-session
}

label {
    monitor =
    text = <span letter_spacing="800">Switch</span>
    color = $fg_muted
    font_size = 10
    font_family = Inter
    position = 120, -210
    halign = center
    valign = center
    onclick = loginctl lock-session
}
