# ==============================================================================
# SCHOOL OF ATHENS : HYPRLAND CONFIGURATION
# Tema: Digital Humanism & School of Athens
# Sesuai Mockup: Rounded Corners 12px, Kawase Blur, Border Emas #db9c5e
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MONITOR & ENVIRONMENT (AMAN UNTUK HOST MAUPUN VIRTUALBOX)
# ------------------------------------------------------------------------------
monitor=,preferred,auto,1

# Safe rendering flags (Wajib agar tidak crash/black screen di VirtualBox/VM)
cursor {
    no_hardware_cursors = true
}
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ------------------------------------------------------------------------------
# 2. EKSEKUSI OTOMATIS (AUTOSTART)
# ------------------------------------------------------------------------------
exec-once = sh -c 'if command -v rinauby-autostart >/dev/null 2>&1; then exec rinauby-autostart; elif [ -f "$HOME/.config/hypr/scripts/autostart.sh" ]; then exec "$HOME/.config/hypr/scripts/autostart.sh"; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-autostart; fi'

# ------------------------------------------------------------------------------
# 3. TAMPILAN, SUDUT MEMBULAT, & BLUR (PERSIS MOCKUP)
# ------------------------------------------------------------------------------
general {
    gaps_in = 8
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(db9c5e) rgb(e5c07b) 45deg
    col.inactive_border = rgba(45535bcc)

    layout = dwindle
}

decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(1a1a1a88)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 0.95
        brightness = 0.90
        vibrancy = 0.25
    }
}

animations {
    enabled = true
    bezier = athens, 0.16, 1, 0.3, 1
    bezier = smoothPop, 0.10, 1.05, 0.15, 1.0
    bezier = easeOutQuart, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, athens, slide
    animation = windowsOut, 1, 4, athens, slide
    animation = border, 1, 6, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, athens, slide
    animation = layersIn, 1, 3.5, smoothPop, popin 70%
    animation = layersOut, 1, 2.5, easeOutQuart, popin 70%
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ------------------------------------------------------------------------------
# 4. ATURAN LAYER (BLUR PADA TOP BAR, SESSION CONTROLS & QUICKSHELL)
# ------------------------------------------------------------------------------
layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar
layerrule = blur, rinauby-bar
layerrule = ignorealpha 0.2, rinauby-bar
layerrule = blur, quickshell
layerrule = ignorezero, quickshell
layerrule = blur, rinauby-session
layerrule = ignorealpha 0.0, rinauby-session
layerrule = noanim, rinauby-session
layerrule = noanim, rinauby-launcher
layerrule = noanim, rinauby-mediacontrols
# Catatan: rinauby-launcher & rinauby-mediacontrols tanpa aturan blur agar latar desktop sekitar popup tetap jernih dan tajam

# ------------------------------------------------------------------------------
# 5. KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Aplikasi Pokok
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, T, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, I, exec, sh -c 'if command -v rinauby-settings >/dev/null 2>&1; then exec rinauby-settings --toggle; else exec python3 /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/settings-gtk/main.py --toggle; fi'
bind = $mainMod, comma, exec, sh -c 'if command -v rinauby-settings >/dev/null 2>&1; then exec rinauby-settings --toggle; else exec python3 /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/settings-gtk/main.py --toggle; fi'
bind = $mainMod, F, togglefloating,
bind = $mainMod, SPACE, exec, sh -c 'if command -v rinauby-launcher >/dev/null 2>&1; then exec rinauby-launcher drun; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-launcher drun; fi'
bind = $mainMod, D, exec, sh -c 'if command -v rinauby-launcher >/dev/null 2>&1; then exec rinauby-launcher drun; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-launcher drun; fi'
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, A, exec, sh -c 'if command -v rinauby-syspanel >/dev/null 2>&1; then exec rinauby-syspanel; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-syspanel; fi'
bind = $mainMod, N, exec, sh -c 'if command -v rinauby-syspanel >/dev/null 2>&1; then exec rinauby-syspanel; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-syspanel; fi'
bind = $mainMod, V, exec, sh -c 'if command -v rinauby-launcher >/dev/null 2>&1; then exec rinauby-launcher clipboard; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-launcher clipboard; fi'

# Session Controls (Power Menu) & Lockscreen
bind = $mainMod, BackSpace, exec, sh -c 'if command -v rinauby-powermenu >/dev/null 2>&1; then exec rinauby-powermenu; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/scripts/powermenu.sh; fi'
bind = $mainMod, Escape, exec, sh -c 'if command -v rinauby-powermenu >/dev/null 2>&1; then exec rinauby-powermenu; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/scripts/powermenu.sh; fi'
bind = $mainMod, L, exec, sh -c 'if [ -f "$HOME/.config/hypr/hyprlock.conf" ]; then exec hyprlock -c "$HOME/.config/hypr/hyprlock.conf"; else exec hyprlock -c /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/hypr/hyprlock.conf; fi'

# Wallpaper Selector (Quickshell 3D Coverflow)
bind = $mainMod ALT, W, exec, sh -c 'if command -v rinauby-wp-selector >/dev/null 2>&1; then exec rinauby-wp-selector; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-wp-selector; fi'
bind = $mainMod, K, exec, sh -c 'if command -v rinauby-wp-selector >/dev/null 2>&1; then exec rinauby-wp-selector; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-wp-selector; fi'
bind = CTRL $mainMod, T, exec, sh -c 'if command -v rinauby-wp-selector >/dev/null 2>&1; then exec rinauby-wp-selector; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/bin/rinauby-wp-selector; fi'

# Navigasi Fokus Jendela
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Pindah Jendela (Shift + Arrow)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Pindah ke Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, Z, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic

# Screenshot (Rinauby Tool)
$screenshot = sh -c 'if command -v rinauby-screenshot >/dev/null 2>&1; then exec rinauby-screenshot "$@"; else exec /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/scripts/screenshot.sh "$@"; fi' --
bind = $mainMod SHIFT, S, exec, $screenshot snip
bind = $mainMod SHIFT, SPACE, exec, $screenshot snip
bind = , Print, exec, $screenshot full
bind = CTRL, Print, exec, $screenshot full
bind = $mainMod, Print, exec, $screenshot menu
bind = $mainMod SHIFT, E, exec, $screenshot edit

# Media & Brightness OSD (Pill Capsules)
$osd = sh -c 'if command -v rinauby-osd >/dev/null 2>&1; then exec rinauby-osd "$@"; else exec python3 /home/rifqi/Workspace/Belajar/SO/Tubes-2604/Rancangan/assets/dotfiles/scripts/osd.py "$@"; fi' --
bindel = , XF86AudioRaiseVolume, exec, $osd volume-up
bindel = , XF86AudioLowerVolume, exec, $osd volume-down
bindl  = , XF86AudioMute, exec, $osd volume-mute
bindel = , XF86MonBrightnessUp, exec, $osd brightness-up
bindel = , XF86MonBrightnessDown, exec, $osd brightness-down

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Rinauby Dynamic Settings Overrides
source = ~/.config/hypr/rinauby_overrides.conf
