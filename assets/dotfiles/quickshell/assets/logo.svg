<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#db9c5e"/>
      <stop offset="100%" stop-color="#b87732"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b87732" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e5c07b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#db9c5e" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Classical Geometric Framework -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#ringGrad)" stroke-width="1"/>

  <!-- Renaissance Octagram (Four cardinal & four ordinal rays) -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6">
    <line x1="128" y1="18" x2="128" y2="238"/>
    <line x1="18" y1="128" x2="238" y2="128"/>
    <line x1="50" y1="50" x2="206" y2="206"/>
    <line x1="50" y1="206" x2="206" y2="50"/>
  </g>

  <!-- Diamond / Rhombus Golden Proportion Core -->
  <polygon points="128,40 216,128 128,216 40,128" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
  <polygon points="128,58 198,128 128,198 58,128" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"/>

  <!-- Center Renaissance Humanist Arch & Compass Monogram (R) -->
  <g filter="url(#glow)">
    <!-- Classical Pillar Left -->
    <path d="M 88,172 L 88,96 Q 88,84 100,84 L 136,84 Q 164,84 164,108 Q 164,130 138,132 L 166,172" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Central Crossbar / Arch Accent -->
    <path d="M 88,132 L 138,132" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Top Finial / Renaissance Star -->
    <circle cx="128" cy="40" r="4" fill="#f5d77f"/>
    <circle cx="128" cy="216" r="4" fill="#f5d77f"/>
    <circle cx="40" cy="128" r="4" fill="#f5d77f"/>
    <circle cx="216" cy="128" r="4" fill="#f5d77f"/>
  </g>
</svg>

